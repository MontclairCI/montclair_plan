[package]
name = "montclair_plan"
version = "0.1.0"
edition = "2024"

[dependencies]
allocative = "0.3.6"
auth-git2 = "0.6.0"
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.21.0", features = [
    "https",
    "vendored-libgit2",
    "vendored-openssl",
] }
petgraph = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.14.2"
starlark_derive = "0.14.2"
strum = { version = "0.28.0", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.4", features = ["serde", "v7"] }
montclair_observability = { git = "https://github.com/MontclairCI/montclair_observability.git" }
montclair_container = { git = "https://github.com/MontclairCI/montclair_container.git" }
montclair_git = { git = "https://github.com/MontclairCI/montclair_git.git" }
sqlx = { version = "0.9.0", features = ["derive"] }
anyhow = "1.0.104"

[lib]
name = "montclair_plan"
path = "src/lib.rs"

[lints.clippy]
new_without_default = "allow"
